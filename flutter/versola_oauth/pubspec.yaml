name: versola_oauth
description: >-
  Flutter binding of the Versola generic OAuth 2.0 / OpenID Connect SDK: a Pigeon bridge over
  the native Android and iOS facades. No protocol logic in Dart.
version: 0.1.0
repository: https://github.com/versolauth/versola-sdk
# Publishing from the monorepo is dormant (release.yml); do not add a publish_to that enables it.

environment:
  # Pinned tightly (.claude/rules/flutter.md): pubspec.lock is not committed, so these ranges
  # are what makes a build repeatable. The toolchain is flutter/.fvmrc (3.47.8, Dart 3.13.7).
  sdk: ">=3.13.0 <3.14.0"
  flutter: ">=3.47.0 <3.48.0"

dependencies:
  flutter:
    sdk: flutter
  # The `Client` / `BaseClient` types of OAuthClient.httpClient(), so an app composes the
  # authenticated client with its own interceptors. Dart-team package (dart.dev), BSD-3-Clause;
  # pulls http_parser and web (same publisher). A range across 1.x, not a one-minor pin: the
  # type is part of the public API and shared with the integrator's own graph, where a tight pin
  # would fail their resolve (flutter.md, "Packages and dependencies"). 1.6.0 is the tested floor.
  http: ">=1.6.0 <2.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  # The bridge generator; the version is part of the contract, since both native halves are
  # generated from pigeons/messages.dart with it. Flutter-team package, BSD-3-Clause.
  pigeon: 29.0.12

flutter:
  plugin:
    platforms:
      android:
        package: versola.oauth.flutter
        pluginClass: VersolaOAuthPlugin
      ios:
        pluginClass: VersolaOAuthPlugin
