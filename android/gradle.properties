org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
# AGP 9's built-in Kotlin has no working integration with
# kotlinx-binary-compatibility-validator (Kotlin/binary-compatibility-validator#312,
# tracked upstream as KT-83410, backlog / no fix planned as of writing). Opting out
# keeps the API-compatibility check in #4's CI list working; both properties are
# required together per https://developer.android.com/build/migrate-to-built-in-kotlin.
android.builtInKotlin=false
android.newDsl=false
kotlin.code.style=official

# Publishing (gradle/publishing.gradle.kts, release.yml). The Maven group is the one place
# reverse-DNS survives: Central verifies a groupId by DNS ownership (docs/adr/0001). The version
# is the development version; a release passes -PreleaseVersion=<x.y.z> taken from the tag, and
# release.yml refuses a tag that disagrees with flutter/versola_oauth/pubspec.yaml.
GROUP=io.versola
VERSION_NAME=0.1.0-SNAPSHOT
