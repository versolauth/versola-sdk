id: 16-iss-mismatch
title: iss mismatch on redirect is a hard failure
issues: [5, 11, 15]
applies_to: [android, ios, flutter]
facade: [versola, oauth]
mode: any
preconditions:
  - An authorization request is outstanding.
  - The configured issuer is known to the SDK.
steps:
  - actor: harness
    action: Deliver a redirect with a correct state and an iss naming a different issuer.
  - actor: sdk
    action: Validate iss per RFC 9207.
assertions:
  - No request reaches the token endpoint.
  - Configuration surfaces.
  - A redirect omitting iss entirely, from a deployment that advertises authorization_response_iss_parameter_supported, is rejected identically.
  - The failure is reported distinctly from a state mismatch in logs, though both share the category.
