id: 15-state-mismatch
title: a redirect whose state is not the pending request's is ignored while the login waits
issues: [5, 11, 15]
applies_to: [android, ios, flutter]
facade: [versola, oauth]
mode: any
preconditions:
  - An authorization request is outstanding with a known persisted state, and something awaits its redirect (a login in the browser, or a resume after a cold start).
steps:
  - actor: harness
    action: Deliver a redirect for the configured redirect URI carrying a valid-looking code and a state the SDK never issued.
  - actor: sdk
    action: Compare against the persisted state, in constant time.
    expect: The redirect is not the awaited response, so it is ignored.
  - actor: harness
    action: Deliver a redirect for the configured redirect URI with no state at all.
    expect: Ignored the same way.
  - actor: harness
    action: Deliver the genuine redirect, carrying the persisted state.
    expect: The login completes.
assertions:
  - "No request reaches the token endpoint for the redirect whose state is not the persisted one, nor for one with no state."
  - "The login does not fail and `StateMismatch` is not surfaced; the session state stays Authorizing and the caller keeps waiting."
  - "The pending request is kept, unchanged: the state, the code verifier and the nonce persisted before the browser opened are the ones the genuine redirect is validated against."
  - "The comparison is constant-time, and the log line that records the ignored redirect carries neither the state nor any other value of the URL."
  - "The ignored redirect starts no second login and no second waiter: the number of browser sessions opened and of callers waiting is what it was before it arrived."
  - "A redirect carrying the correct state afterwards is honoured and completes the login, whether it arrives in the same process or in a cold-started one."
  - "A cold-started process that finds redirects buffered before it read the pending request skips every buffered redirect whose state is not the persisted one and validates the first that is, if any; the wait then continues for as long as the request lives."
  - "A redirect with the correct state is still validated in full: a wrong or missing `iss` (scenario 16) or a response with neither `code` nor `error` fails the login as before, and an `error` carrying the correct state is the provider's answer."
  - "The dismissal of the browser by the user still ends the wait as UserCancelled after a redirect was ignored (Android: the cancel detection is not silenced by it); the wait ends at the latest when the pending request expires, ten minutes after it was persisted."
notes: >
  Replaces the earlier rule, which failed the login as Configuration(StateMismatch) and wiped the
  pending request. The redirect URI is public (the app's manifest or associated domains name it),
  so any other app or an old link can fire it at the SDK; a redirect that is not the response to
  the request in progress must not be able to end that request. Only a redirect carrying the
  persisted state completes or fails the login. StateMismatch is still what
  AuthorizationResponseValidator reports for a redirect it is handed directly, which the SDK's
  flow no longer does for a waiting login. When the browser surface that delivered the
  non-matching redirect has itself ended (iOS: the ASWebAuthenticationSession completion; Android:
  an Auth Tab result) nothing can follow from it and no dismissal can be observed any more: the
  login ends as UserCancelled and the pending request is wiped (spec/state-machine.md, the
  cancel table). The device tier proves the part no JVM or macOS run models, in
  android/conformance-browser and ios/BrowserLegHost.
