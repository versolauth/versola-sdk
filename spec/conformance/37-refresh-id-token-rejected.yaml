id: 37-refresh-id-token-rejected
title: A refresh whose ID token is rejected, or cannot be checked, keeps the rotated refresh token
issues: [46]
applies_to: [android]
facade: [oauth]
mode: any
fault_injection: [drop-response]
preconditions:
  - The session is Authenticated on a provider that rotates the refresh token on every use.
  - A proxy in front of the provider can rewrite the refresh response body, and can drop requests to the jwks_uri.
  - The SDK has cached the key set at login, so the refresh below fetches nothing unless the harness makes it.
steps:
  - actor: harness
    action: Let the next refresh reach the token endpoint and rewrite the response so its id_token carries a different sub than the login's, keeping the rotated refresh_token and access_token as the provider issued them.
  - actor: sdk
    action: Refresh, then validate the ID token.
  - actor: harness
    action: Restore the response, rewrite its id_token to be signed under a kid that is not in the cached key set, and drop the requests to jwks_uri.
  - actor: sdk
    action: Refresh again, then fail to fetch the key set.
  - actor: harness
    action: Stop dropping requests to jwks_uri and let the next refresh through unmodified.
  - actor: sdk
    action: Refresh a third time.
assertions:
  - The first refresh fails with Configuration, detail IdTokenRejected, reason Malformed.
  - The second refresh fails with Recoverable, never with Configuration or Reauthenticate.
  - After each failure the stored refresh token is the one the provider rotated to in that response, not the one that was sent, and the rotation slot is empty.
  - After each failure the raw ID token stored for id_token_hint and the claims are those of the last accepted ID token, and the access token of the failed response is not served.
  - SessionState is Authenticated after each failure, and no credential teardown ran (the DPoP key, when there is one, still exists).
  - The third refresh sends the token the provider rotated to by the second refresh, succeeds, and no request to the token endpoint answers invalid_grant.
