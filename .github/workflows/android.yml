name: android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

# Least privilege (ci-release.md): nothing here writes to the repository.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      # compileSdk 37 across every module (minSdk 26), so the build needs platform 37.0.
      # Installed explicitly rather than trusting whatever the runner image happens to ship:
      # a missing platform is otherwise left to AGP to download in the middle of the build,
      # which hides the dependency. The
      # sdkmanager id is `platforms;android-37.0` (Google names API 37 with its minor
      # version; `platforms;android-37` does not exist), and build-tools 36.0.0 is the version
      # AGP 9.5.0 uses by default. Every workflow that builds Android installs the same pair.
      # API 36 below is something else: the emulator image and the Robolectric API level.
      - name: Install Android SDK platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" "build-tools;36.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Assemble
        run: ./gradlew assemble

      - name: Unit tests
        run: ./gradlew test

      - name: Lint
        run: ./gradlew lint

      # kotlinx-binary-compatibility-validator. See gradle.properties for why built-in
      # Kotlin is opted out of here (Kotlin/binary-compatibility-validator#312).
      - name: API compatibility
        run: ./gradlew apiCheck

  # The Keystore half of #30 and #37: `src/androidTest` in :storage and :dpop against a real
  # Android Keystore on an emulator. Scoped to those two modules so the rest of the build does
  # not wait on an emulator boot. An emulator proves the software tier and the fall-through
  # from StrongBox; the StrongBox and TEE rows of #37 need a physical device and are a Firebase
  # Test Lab job once a project exists for it (#15, "Device tier").
  instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: build
    strategy:
      fail-fast: false
      matrix:
        # The latest release only. The pre-R branch of the storage key's window (the
        # deprecated setter below API 30) is proven at the unit tier (HardwareKeyProviderTest
        # pins one test to API 29 under Robolectric); a row for 28 ran it on a real Keystore
        # and can come back if a device below 30 ever disagrees. google_apis, not default:
        # Auth Tab needs Chrome.
        api-level: [36]
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The emulator needs hardware acceleration; GitHub's Linux runners expose /dev/kvm but
      # not to the runner user by default.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" "build-tools;36.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Instrumented tests on API ${{ matrix.api-level }}
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: android
          script: ./gradlew :storage:connectedDebugAndroidTest :dpop:connectedDebugAndroidTest

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: instrumented-reports-api-${{ matrix.api-level }}
          path: |
            android/storage/build/reports/androidTests
            android/dpop/build/reports/androidTests
          if-no-files-found: ignore
