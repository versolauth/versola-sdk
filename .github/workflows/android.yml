name: android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # compileSdk 36 across every module (#4's package-coordinates decision, #1 §4's
      # API 26 / target 36 floor). Installed explicitly rather than trusting whatever
      # the runner image happens to ship.
      - name: Install Android SDK platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v5

      - name: Assemble
        run: ./gradlew assemble

      - name: Unit tests
        run: ./gradlew test

      - name: Lint
        run: ./gradlew lint

      # kotlinx-binary-compatibility-validator. See gradle.properties for why built-in
      # Kotlin is opted out of here (Kotlin/binary-compatibility-validator#312).
      - name: API compatibility
        run: ./gradlew apiCheck

  # The Keystore half of #30 and #37: `src/androidTest` in :storage and :dpop against a real
  # Android Keystore on an emulator. Scoped to those two modules so the rest of the build does
  # not wait on an emulator boot. An emulator proves the software tier and the fall-through
  # from StrongBox; the StrongBox and TEE rows of #37 need a physical device and are a Firebase
  # Test Lab job once a project exists for it (#15, "Device tier").
  instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: build
    strategy:
      fail-fast: false
      matrix:
        # The latest release only. The pre-R branch of the storage key's window (the
        # deprecated setter below API 30) is proven at the unit tier (HardwareKeyProviderTest
        # pins one test to API 29 under Robolectric); a row for 28 ran it on a real Keystore
        # and can come back if a device below 30 ever disagrees. google_apis, not default:
        # Auth Tab needs Chrome.
        api-level: [36]
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      # The emulator needs hardware acceleration; GitHub's Linux runners expose /dev/kvm but
      # not to the runner user by default.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v5

      - name: Instrumented tests on API ${{ matrix.api-level }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: android
          script: ./gradlew :storage:connectedDebugAndroidTest :dpop:connectedDebugAndroidTest

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-reports-api-${{ matrix.api-level }}
          path: |
            android/storage/build/reports/androidTests
            android/dpop/build/reports/androidTests
          if-no-files-found: ignore
