name: release

# A release is a tag. Pushing a tag `X.Y.Z` (0.1.0, no `v`: the tag is the version) runs this file:
# the three platforms are checked against the tag, the Android artefacts are signed and uploaded to
# the Maven Central Portal, the Swift package is proven to resolve and build at the tag, and a
# GitHub release is created with generated notes. docs/releasing.md has the runbook and what has
# to exist first (the Central namespace, the signing key and the four secrets).
#
# Nothing in this file has run on GitHub yet: the first tag is its first run, which is why the
# Central upload is USER_MANAGED by default (a deployment that waits in the Portal for a click and
# can be dropped there; the repository variable MAVEN_CENTRAL_PUBLISHING_TYPE=AUTOMATIC publishes
# on validation instead) and why docs/releasing.md has the maintainer look at a local bundle first.
#
# The pub.dev job lives in publish-pubdev.yml (it is dormant: the first publish is by hand).
# CocoaPods and npm below are dormant too: there is no podspec and no React Native package.

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  # The tag is the version, and the three platforms must agree with it before anything is built:
  # the Android artefacts take it from the tag, SwiftPM resolves the tag, pub.dev publishes the
  # pubspec's. tools/check-release-version.sh reads files only.
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history, so the next step can ask whether the tagged commit is on main.
          fetch-depth: 0
      # Anyone who can push a tag would otherwise be able to publish any branch. A release is cut
      # from main; a tag on a commit that main does not contain is refused before anything is built.
      - name: The tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Tag, pubspec, plugin pin and changelog agree
        run: tools/check-release-version.sh "$RELEASE_TAG"
        env:
          # Through env, never interpolated into the script: a tag name is attacker-shaped input
          # to anything that runs it as shell (ci-release.md). The script matches X.Y.Z only.
          RELEASE_TAG: ${{ github.ref_name }}

  # Six artefacts under io.versola (docs/releasing.md has the list and why each exists):
  # `oauth-android` and the five modules its POM names. The Central Portal takes one signed zip in
  # Maven layout; this job builds it and uploads it as USER_MANAGED unless the repository variable
  # MAVEN_CENTRAL_PUBLISHING_TYPE says AUTOMATIC (Settings, Secrets and variables, Variables). A
  # USER_MANAGED deployment waits in the Portal for the maintainer's click and can be dropped there;
  # an AUTOMATIC one is published as soon as Central validates it, and Central releases are
  # immutable. Switch only once a USER_MANAGED release has gone through.
  maven-central:
    needs: verify-version
    runs-on: ubuntu-latest
    # The signing key and the Portal token are secrets of this environment (or of the repository).
    # GitHub creates the environment on first use; adding required reviewers to it (Settings,
    # Environments) puts a human between a pushed tag and the upload.
    environment: maven-central
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Android SDK platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" "build-tools;36.0.0" > /dev/null
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      # The gate before anything is signed: what the release would ship has to pass what every
      # pull request passes (android.yml).
      - name: Test, lint and API check
        run: ./gradlew test lint apiCheck

      - name: Build the signed bundle
        run: ./gradlew centralBundle -PreleaseVersion="$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          # The armoured private key and its passphrase, read in memory by the signing plugin; no
          # key file is written to the runner.
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.MAVEN_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.MAVEN_SIGNING_PASSWORD }}

      # The exact zip that is about to be uploaded, checked before it is: all six modules are in it at
      # the tag, every module the POMs name is in it, every artefact file has its checksums and its
      # signature (presence only; the private key stays in the step above). A failure stops the job
      # before anything reaches Central; this is what makes the later Publish click a click on a
      # checked artefact. The script lives at the repository root, hence the working-directory
      # override.
      - name: Check the bundle before it is uploaded
        working-directory: .
        run: |
          bundle="$RUNNER_TEMP/bundle"
          rm -rf "$bundle"
          mkdir "$bundle"
          unzip -q "android/build/central-bundle/versola-${RELEASE_TAG}.zip" -d "$bundle"
          tools/verify-consumer/check-bundle.sh "$bundle" "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ github.ref_name }}

      # Central Portal Publisher API (https://central.sonatype.com/api/v1/publisher/upload):
      # `Authorization: Bearer base64(user:password)` with a Portal user token, a multipart part
      # named `bundle`, `publishingType` USER_MANAGED or AUTOMATIC. The token goes to curl on stdin as a
      # config file, so it never appears in a process list or in the log, and is masked anyway.
      - name: Upload the bundle
        run: |
          token="$(printf '%s:%s' "$SONATYPE_USERNAME" "$SONATYPE_PASSWORD" | base64 | tr -d '\n')"
          echo "::add-mask::$token"
          version="$RELEASE_TAG"
          case "$PUBLISHING_TYPE" in
            USER_MANAGED|AUTOMATIC) ;;
            *) echo "::error::MAVEN_CENTRAL_PUBLISHING_TYPE must be USER_MANAGED or AUTOMATIC"; exit 1 ;;
          esac
          id="$(printf 'header = "Authorization: Bearer %s"\n' "$token" | curl --fail --silent --show-error \
            --config - -X POST \
            -F "bundle=@build/central-bundle/versola-${version}.zip" \
            "https://central.sonatype.com/api/v1/publisher/upload?name=versola-${version}&publishingType=${PUBLISHING_TYPE}")"
          echo "deployment id: $id"
          # Validation takes a minute or two; wait for it so a rejected bundle fails this job
          # instead of sitting unnoticed in the Portal.
          for _ in $(seq 1 30); do
            state="$(printf 'header = "Authorization: Bearer %s"\n' "$token" | curl --fail --silent --show-error \
              --config - -X POST "https://central.sonatype.com/api/v1/publisher/status?id=${id}" \
              | python3 -I -c 'import json,sys; print(json.load(sys.stdin)["deploymentState"])')"
            echo "state: $state"
            case "$state" in
              VALIDATED|PUBLISHING|PUBLISHED) exit 0 ;;
              FAILED) echo "::error::Central rejected the bundle; see the deployment in the Portal"; exit 1 ;;
            esac
            sleep 20
          done
          echo "::error::the deployment did not validate within ten minutes"
          exit 1
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          PUBLISHING_TYPE: ${{ vars.MAVEN_CENTRAL_PUBLISHING_TYPE || 'USER_MANAGED' }}
          # A Central Portal user token (central.sonatype.com/account), not a login.
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}

  # SwiftPM consumers resolve the release tag itself: there is nothing to publish. What this job
  # proves is that the tagged tree resolves and builds from a clean checkout, which is what a
  # consumer's `.package(url:, from:)` will do. The simulator name drifts with the runner's Xcode
  # (ios.yml says so).
  swiftpm:
    needs: verify-version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: swift package resolve
      - run: xcodebuild build -scheme Versola-Package -destination "platform=iOS Simulator,name=iPhone 17"

  # The GitHub release for the tag, with notes generated from the merged pull requests. Created
  # only after the Android bundle validated and the Swift package built at the tag, so a failed
  # run leaves a tag and no release. `gh` ships on the runner; no third-party action receives the
  # write token. A USER_MANAGED Central deployment reaches Central when the maintainer publishes it
  # in the Portal, not when this job ends.
  github-release:
    needs: [maven-central, swiftpm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Only to dispatch verify-release below.
      actions: write
    steps:
      - name: Create the release
        run: gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$RELEASE_TAG" --generate-notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}

      # The consumer check (verify-release.yml): apps that install the release from Maven Central,
      # SwiftPM and a Flutter git dependency. Dispatched here because a release created with the
      # workflow's own token does not fire that workflow's `release: published` trigger (GitHub
      # does not start workflow runs from events the GITHUB_TOKEN causes; `workflow_dispatch` is
      # the documented exception). It waits for the maintainer's click in the Central Portal, up
      # to three hours; a run that timed out is started again from the Actions tab. It runs on the
      # default branch, which is where its scripts are.
      - name: Start the consumer check
        run: gh workflow run verify-release.yml --repo "$GITHUB_REPOSITORY" -f version="$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}

  # CocoaPods is dormant (ios-swift.md): there is no podspec, and the plugin's iOS half is SwiftPM
  # only. Kept so the pipeline shape exists if the maintainer ever wants it.
  cocoapods:
    if: false
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Push podspec to CocoaPods trunk
        run: pod trunk push Versola.podspec --allow-warnings
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}

  npm:
    # @versola/react-native. #20 may never be built, see #1 section 1 (React Native is last,
    # conditional on demand). Kept here only so the pipeline shape exists.
    if: false
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react-native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
