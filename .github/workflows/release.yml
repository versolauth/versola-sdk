name: release

# Wired but dormant (#4, B7 of #46): every job below is gated off with `if: false`. Releasing is the
# maintainer's act, end to end: the credentials, the tag, the GitHub release that triggers this file
# and flipping a job's condition on are all theirs (docs/releasing.md has the runbook and what has
# to exist first). Nothing in this file has run on GitHub: the maintainer's first release is its
# first run, which is why the Central upload is USER_MANAGED (a deployment that waits in the Portal
# and can be dropped) and why docs/releasing.md has the maintainer look at a local bundle first.
#
# The pub.dev job lives in publish-pubdev.yml: pub.dev authenticates a workflow by the tag push
# that triggered it, and this file is triggered by a published release.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # The tag is the version, and the three platforms must agree with it before anything is built:
  # the Android artefacts take it from the tag, SwiftPM resolves the tag, pub.dev publishes the
  # pubspec's. tools/check-release-version.sh reads files only.
  verify-version:
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag, pubspec, plugin pin and changelog agree
        run: tools/check-release-version.sh "$RELEASE_TAG"
        env:
          # Through env, never interpolated into the script: a tag name is attacker-shaped input
          # to anything that runs it as shell (ci-release.md). The script matches vX.Y.Z only.
          RELEASE_TAG: ${{ github.event.release.tag_name }}

  # Six artefacts under kz.versola (docs/releasing.md has the list and why each exists):
  # `oauth-android` and the five modules its POM names. The Central Portal takes one signed zip in Maven layout; this job builds it
  # and uploads it as USER_MANAGED, so the deployment waits in the Portal for the maintainer's
  # click and can be dropped there. Switching to AUTOMATIC is a later decision, not this file's.
  maven-central:
    if: false
    needs: verify-version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Android SDK platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      # The gate before anything is signed: what the release would ship has to pass what every
      # pull request passes (android.yml).
      - name: Test, lint and API check
        run: ./gradlew test lint apiCheck

      - name: Build the signed bundle
        run: ./gradlew centralBundle -PreleaseVersion="${RELEASE_TAG#v}"
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          # The armoured private key and its passphrase, read in memory by the signing plugin; no
          # key file is written to the runner.
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.MAVEN_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.MAVEN_SIGNING_PASSWORD }}

      # Central Portal Publisher API (https://central.sonatype.com/api/v1/publisher/upload):
      # `Authorization: Bearer base64(user:password)` with a Portal user token, a multipart part
      # named `bundle`, `publishingType=USER_MANAGED`. The token goes to curl on stdin as a
      # config file, so it never appears in a process list or in the log, and is masked anyway.
      - name: Upload the bundle (USER_MANAGED)
        run: |
          token="$(printf '%s:%s' "$SONATYPE_USERNAME" "$SONATYPE_PASSWORD" | base64 | tr -d '\n')"
          echo "::add-mask::$token"
          version="${RELEASE_TAG#v}"
          id="$(printf 'header = "Authorization: Bearer %s"\n' "$token" | curl --fail --silent --show-error \
            --config - -X POST \
            -F "bundle=@build/central-bundle/versola-${version}.zip" \
            "https://central.sonatype.com/api/v1/publisher/upload?name=versola-${version}&publishingType=USER_MANAGED")"
          echo "deployment id: $id"
          # Validation takes a minute or two; wait for it so a rejected bundle fails this job
          # instead of sitting unnoticed in the Portal.
          for _ in $(seq 1 30); do
            state="$(printf 'header = "Authorization: Bearer %s"\n' "$token" | curl --fail --silent --show-error \
              --config - -X POST "https://central.sonatype.com/api/v1/publisher/status?id=${id}" \
              | python3 -I -c 'import json,sys; print(json.load(sys.stdin)["deploymentState"])')"
            echo "state: $state"
            case "$state" in
              VALIDATED|PUBLISHING|PUBLISHED) exit 0 ;;
              FAILED) echo "::error::Central rejected the bundle; see the deployment in the Portal"; exit 1 ;;
            esac
            sleep 20
          done
          echo "::error::the deployment did not validate within ten minutes"
          exit 1
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          # A Central Portal user token (central.sonatype.com/account), not a login.
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}

  # SwiftPM consumers resolve the release tag itself: there is nothing to publish. What this job
  # proves is that the tagged tree resolves and builds from a clean checkout, which is what a
  # consumer's `.package(url:, from:)` will do. The simulator name drifts with the runner's Xcode
  # (ios.yml says so).
  swiftpm:
    if: false
    needs: verify-version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: swift package resolve
      - run: xcodebuild build -scheme Versola-Package -destination "platform=iOS Simulator,name=iPhone 17"

  # CocoaPods is dormant (ios-swift.md): there is no podspec, and the plugin's iOS half is SwiftPM
  # only. Kept so the pipeline shape exists if the maintainer ever wants it.
  cocoapods:
    if: false
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Push podspec to CocoaPods trunk
        run: pod trunk push Versola.podspec --allow-warnings
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}

  npm:
    # @versola/react-native. #20 may never be built, see #1 section 1 (React Native is last,
    # conditional on demand). Kept here only so the pipeline shape exists.
    if: false
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react-native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
