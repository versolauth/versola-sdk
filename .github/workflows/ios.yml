name: ios

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "Package.swift"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - "Package.swift"
      - ".github/workflows/ios.yml"

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # The acceptance criterion in #4 this exists to verify: SPM cannot resolve
      # Package.swift from a subdirectory, which is why it sits at the repo root with
      # targets whose path: points into ios/ (#1 §3). A bare `git clone` + this step,
      # with no other setup, is the actual test.
      - name: SPM resolution from a clean checkout
        run: swift package resolve

      - name: Build
        run: xcodebuild build -scheme Versola-Package -destination "generic/platform=iOS"

      - name: Unit tests
        run: xcodebuild test -scheme Versola-Package -destination "platform=iOS Simulator,name=iPhone 16"
