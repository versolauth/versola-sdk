name: ios

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "Package.swift"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - "Package.swift"
      - ".github/workflows/ios.yml"

# Least privilege (ci-release.md): nothing here writes to the repository.
permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The acceptance criterion in #4 this exists to verify: SPM cannot resolve
      # Package.swift from a subdirectory, which is why it sits at the repo root with
      # targets whose path: points into ios/ (#1 §3). A bare `git clone` + this step,
      # with no other setup, is the actual test.
      - name: SPM resolution from a clean checkout
        run: swift package resolve

      # The schemes Xcode generates for the package. With one library product (VersolaOAuth) the
      # only scheme is named after the *package* (`Versola`, `name:` in Package.swift): there is no
      # `Versola-Package` aggregate, which exists from two products on, and no scheme named after the
      # product (Xcode 26.6 on the runner printed exactly `Versola`). Printed on every run so a
      # scheme that moves with an Xcode upgrade is readable in the log.
      - name: List the schemes
        run: xcodebuild -list

      # Hosted images change their simulator names and may not have an iOS runtime ready.
      # Select a concrete device by UDID, installing a runtime or creating a device if needed,
      # so the test destination does not depend on a particular iPhone model or OS:latest.
      - name: Prepare the iOS simulator
        run: |
          if ! xcrun simctl list runtimes --json | jq -e '.runtimes[] | select(.isAvailable and (.identifier | startswith("com.apple.CoreSimulator.SimRuntime.iOS-")))' > /dev/null; then
            xcodebuild -downloadPlatform iOS
          fi
          runtime=$(xcrun simctl list runtimes --json | jq -er '[.runtimes[] | select(.isAvailable and (.identifier | startswith("com.apple.CoreSimulator.SimRuntime.iOS-")))] | sort_by(.version | split(".") | map(tonumber)) | last | .identifier // empty')
          simulator_id=$(xcrun simctl list devices available --json | jq -r --arg runtime "$runtime" '[.devices[$runtime][]? | select(.isAvailable and (.name | startswith("iPhone")))] | first | .udid // empty')
          if [[ -z "$simulator_id" ]]; then
            device_type=$(xcrun simctl list runtimes --json | jq -er --arg runtime "$runtime" '.runtimes[] | select(.identifier == $runtime) | [.supportedDeviceTypes[] | select(.productFamily == "iPhone")] | first | .identifier // empty')
            simulator_id=$(xcrun simctl create "SDK CI iPhone" "$device_type" "$runtime")
          fi
          xcrun simctl bootstatus "$simulator_id" -b
          echo "IOS_SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"
          echo "Using iOS simulator $simulator_id ($runtime)"

      # Building for a generic simulator needs no signing; tests use the prepared concrete UDID.
      - name: Build
        run: xcodebuild build -scheme Versola -destination "generic/platform=iOS Simulator"

      - name: Unit tests
        run: xcodebuild test -scheme Versola -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_ID"
