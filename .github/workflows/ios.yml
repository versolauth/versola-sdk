name: ios

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "Package.swift"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - "Package.swift"
      - ".github/workflows/ios.yml"

# Least privilege (ci-release.md): nothing here writes to the repository.
permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The acceptance criterion in #4 this exists to verify: SPM cannot resolve
      # Package.swift from a subdirectory, which is why it sits at the repo root with
      # targets whose path: points into ios/ (#1 §3). A bare `git clone` + this step,
      # with no other setup, is the actual test.
      - name: SPM resolution from a clean checkout
        run: swift package resolve

      # `generic/platform=iOS` (the device) fails here with "Supported platforms for the
      # buildables in the current scheme is empty": a device destination doesn't resolve cleanly
      # against the auto-generated Package scheme without an explicit per-target platform. The
      # generic *simulator* destination needs no signing and no device name, so the build step
      # uses it and cannot go stale when the runner's Xcode drops a simulator. `test` has to
      # execute somewhere, so it names a concrete device: the runner image's default simulator,
      # which drifts on Xcode upgrades (it replaced "iPhone 16" - no longer present - with
      # "iPhone 17"); expect to bump that one again when it next disappears.
      - name: Build
        run: xcodebuild build -scheme Versola-Package -destination "generic/platform=iOS Simulator"

      - name: Unit tests
        run: xcodebuild test -scheme Versola-Package -destination "platform=iOS Simulator,name=iPhone 17"
