name: publish-pubdev

# versola_oauth on pub.dev. The first upload, 0.3.0, was published manually under versola.io.
# Configure the package's pub.dev admin page for versolauth/versola-sdk, tag {{version}},
# environment pub.dev before pushing the next release tag. docs/releasing.md has the runbook.
#
# A separate file because pub.dev authenticates a workflow by the tag push that triggered it
# ("automated publishing" on the package's admin page, tag pattern `{{version}}`), and rejects a
# run that was not triggered by a tag. release.yml runs on the same tag; the two are independent.
#
# dart-lang/setup-dart configures the temporary pub.dev token. Authentication happens after
# Maven propagation, so the token is fresh when Flutter's pub client uploads the package.

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 210
    # The environment gate pub.dev can require (admin page, "Require GitHub Actions environment"),
    # with required reviewers on it, so that pushing a tag is not enough to publish.
    environment: pub.dev
    permissions:
      contents: read
      id-token: write # pub.dev's OIDC authentication
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: The tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Tag, pubspec, plugin pin and changelog agree
        run: tools/check-release-version.sh "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ github.ref_name }}

      - name: Read the pinned Flutter version
        id: flutter
        working-directory: flutter
        run: |
          version="$(jq -r .flutter .fvmrc)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "unexpected Flutter version: $version" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-flutter
        with:
          version: ${{ steps.flutter.outputs.version }}

      - name: Read Flutter's Dart version
        id: dart
        run: |
          version="$(flutter --version --machine | jq -r '.dartSdkVersion | split(" ")[0]')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "unexpected Dart version" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The iOS half depends on the repository's Swift package by path inside a checkout; a
      # published plugin has to name the tag (tools/flutter-prepare-publish.sh). The change is
      # this job's working copy only, never committed.
      - name: Point the iOS half at the release tag
        run: tools/flutter-prepare-publish.sh "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ github.ref_name }}

      - run: flutter pub get
        working-directory: flutter/versola_oauth

      # The checks every pull request passes (flutter.yml), then the upload.
      - name: Analyze and test
        run: |
          flutter analyze
          flutter test
        working-directory: flutter/versola_oauth

      # release.yml publishes the Android dependency independently on the same tag. The plugin
      # must not reach pub.dev until its exact Maven dependency is available to consumers.
      # USER_MANAGED Central releases may wait for the maintainer's Portal click.
      - name: Wait for the Android release on Maven Central
        run: |
          url="https://repo1.maven.org/maven2/io/versola/oauth-android/${RELEASE_TAG}/oauth-android-${RELEASE_TAG}.pom"
          deadline=$((SECONDS + 10800))
          while (( SECONDS < deadline )); do
            if curl --fail --silent --show-error --max-time 20 --output /dev/null "$url"; then
              exit 0
            fi
            echo "Waiting for oauth-android ${RELEASE_TAG} on Maven Central"
            sleep 60
          done
          echo "::error::Android release is not available; publish the Central deployment, then rerun this job"
          exit 1
        env:
          RELEASE_TAG: ${{ github.ref_name }}

      # Same Dart version as Flutter, so setup-dart adds OIDC authentication without changing
      # the toolchain version. The pub token configuration is shared by dart and flutter pub.
      - name: Authenticate to pub.dev with GitHub OIDC
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: ${{ steps.dart.outputs.version }}

      - name: Publish
        run: flutter pub publish --force
        working-directory: flutter/versola_oauth
