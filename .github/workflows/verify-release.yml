name: verify-release

# What a customer gets from a release, built from outside the repository. release.yml proves the
# tagged tree builds and that the Central bundle validates; it cannot prove that a consumer's
# project installs the result, because nothing is on Maven Central until the maintainer clicks
# "Publish" on the USER_MANAGED deployment (docs/releasing.md). This workflow is that proof, one
# job per platform, each running a script of tools/verify-consumer/ that builds a throwaway app
# from what is published:
#
#   android  an app with mavenCentral() and google() only, depending on
#            io.versola:oauth-android:<version> (the AAR and the five modules its POM names)
#   ios      a SwiftPM package depending on the public repository by URL at exactly <version>
#   flutter  an app with versola_oauth as a git dependency at the tag, built for Android and iOS
#
# The tag is the version (X.Y.Z, no `v`), so one version names the Maven artefacts, the Swift tag
# and the Flutter git ref. A green run is the release's acceptance test; a red one means a
# consumer cannot install that version, and Central releases are immutable, so the fix is the
# next version.
#
# Triggers. `release: published` fires when a person publishes a release; a release created by
# release.yml's GITHUB_TOKEN does not fire it (GitHub does not start workflows from events caused
# by that token), so release.yml also dispatches this workflow at the end of its
# `github-release` job. `workflow_dispatch` runs it for any existing version, which is also how the
# workflow and the scripts are tried: run it with the version of an already published release.
#
# The scripts come from the ref the workflow runs on (the tag for a release event, the branch
# chosen for a dispatch), not from the tag being verified: verifying an old release with a new
# script is the point of dispatching it.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Release to verify, X.Y.Z (the tag, no leading v)"
        required: true
        type: string

permissions:
  contents: read

# One verification per version at a time: a dispatch while a release run is polling Central would
# only repeat it.
concurrency:
  group: verify-release-${{ github.event.release.tag_name || inputs.version }}
  cancel-in-progress: false

jobs:
  # The version, validated once, for every job. Both sources are attacker-shaped text to a shell (a
  # tag name, a dispatch input), so they enter through env and are matched against X.Y.Z here;
  # the other jobs read the validated output through env too, and the checkout below takes the
  # ref through `with:`, never a shell.
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Validate the version
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then version="$INPUT_VERSION"; else version="$RELEASE_TAG"; fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::not a release version X.Y.Z (no leading v): '$version'"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # Waits for the maintainer's click and Central's propagation, on its own cheap job so the macOS
  # runners are not held, and billed, for hours. 3 hours is generous for a click that follows a
  # green release run. The Android job and the Flutter job both need it: the plugin's Android half
  # depends on io.versola:oauth-android from Central. The iOS job does not (SwiftPM resolves the
  # tag from GitHub).
  central:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Wait for Maven Central
        run: tools/verify-consumer/wait-for-central.sh "$VERSION"
        env:
          VERSION: ${{ needs.version.outputs.version }}

  android:
    needs: [version, central]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # JDK 21 for Gradle, bytecode stays Java 17 (android.yml says why).
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      # The same pair android.yml installs: compileSdk 37 needs platform 37.0, and build-tools
      # 36.0.0 is AGP 9.5.0's default.
      - name: Install Android SDK platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" "build-tools;36.0.0" > /dev/null

      - name: Build an app that depends on the published artefacts
        run: tools/verify-consumer/android.sh "$VERSION"
        env:
          VERSION: ${{ needs.version.outputs.version }}

  ios:
    needs: version
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # By URL, from the public repository: the destination is `generic/platform=iOS Simulator`,
      # so there is no simulator name to drift with the runner's Xcode (ios.yml).
      - name: Build a package that depends on the published tag
        run: tools/verify-consumer/ios.sh "$VERSION"
        env:
          VERSION: ${{ needs.version.outputs.version }}

  # macOS so that both the APK and the iOS build run from one job (flutter.sh builds iOS only on
  # a Mac); JDK 21 and the Android platform are installed as in the android job.
  flutter:
    needs: [version, central]
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the pinned Flutter version
        id: flutter
        working-directory: flutter
        run: |
          version="$(jq -r .flutter .fvmrc)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "unexpected Flutter version: $version" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          cache: true

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" "build-tools;36.0.0" > /dev/null

      # The plugin as a git dependency at the tag, from the public repository: the install an
      # app does today, before pub.dev has it. Its Android half pulls oauth-android from Central
      # (hence `needs: central`); its iOS half is a SwiftPM package that finds the SDK root from
      # its own location in the pub cache.
      - name: Build an app that depends on the plugin at the tag
        run: tools/verify-consumer/flutter.sh "$VERSION"
        env:
          VERSION: ${{ needs.version.outputs.version }}

  # Which platforms passed, in one place. `if: always()` so a failed platform still gets a
  # summary instead of a skipped job, and the job fails when any platform did not succeed, so the
  # run's colour is the verdict.
  summary:
    needs: [version, central, android, ios, flutter]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report
        env:
          VERSION: ${{ needs.version.outputs.version }}
          VERSION_RESULT: ${{ needs.version.result }}
          CENTRAL_RESULT: ${{ needs.central.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
          IOS_RESULT: ${{ needs.ios.result }}
          FLUTTER_RESULT: ${{ needs.flutter.result }}
        run: |
          {
            echo "### verify-release ${VERSION:-(no valid version)}"
            echo
            echo "| Platform | Proves | Result |"
            echo "|---|---|---|"
            echo "| Maven Central | \`oauth-android\` is published | $CENTRAL_RESULT |"
            echo "| Android | an app resolves and compiles against Maven Central | $ANDROID_RESULT |"
            echo "| iOS | a SwiftPM package resolves the tag by URL and builds \`VersolaOAuth\` for the simulator | $IOS_RESULT |"
            echo "| Flutter | an app with the plugin as a git dependency builds for Android and iOS | $FLUTTER_RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"
          for result in "$VERSION_RESULT" "$CENTRAL_RESULT" "$ANDROID_RESULT" "$IOS_RESULT" "$FLUTTER_RESULT"; do
            [[ "$result" == "success" ]] || { echo "::error::not every platform passed (see the summary)"; exit 1; }
          done
