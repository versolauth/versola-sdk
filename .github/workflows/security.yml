name: Security

# Supply-chain and code scanning. Separate from android.yml and ios.yml so a scanner's outage or
# a newly published CVE never blocks the build; the findings that gate a merge are the ones
# introduced by the change itself (secrets, new vulnerable dependencies, SAST errors).
#
# What gates and what only reports is deliberate and written next to each job. Triage and SLAs
# are in SECURITY.md ("Vulnerability management").

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # One `schedule:` key: a second one made GitHub reject the whole file (no jobs ran at all).
  schedule:
    # An off-the-hour minute: GitHub delays or drops scheduled runs queued at :00.
    - cron: "17 4 * * 1"
    # Recheck existing code against newly published findings every Monday.
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Verified credentials committed anywhere in the history this PR/push adds. Gates. Full
  # history (fetch-depth 0) so the scanner can diff the range the event carries.
  secrets:
    # The action uses event commit ranges; full-tree scans below also run on schedules.
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan for verified secrets
        uses: trufflesecurity/trufflehog@31ce31ee1abbcc7dc8eee5764c17121c3044c8b2 # v3.99.7
        with:
          extra_args: --only-verified

  # Known-vulnerable dependencies introduced by a PR (Gradle, Swift, pub and GitHub Actions are
  # all in the dependency graph). Gates on high and above. Needs GitHub Advanced Security while
  # the repository is private and switches on by itself when it goes public.
  dependency-review:
    if: ${{ github.event_name == 'pull_request' && !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  # CodeQL for the Kotlin of the Android modules and the Swift of the iOS targets. Findings
  # appear under Security > Code scanning. Needs GitHub Advanced Security while the repository
  # is private and switches on by itself when it goes public. Both languages build explicitly,
  # the way android.yml and ios.yml do: autobuild finds neither android/gradlew (not at the root)
  # nor a scheme for the iOS-only Package.swift. Swift needs a macOS runner.
  codeql:
    if: ${{ !github.event.repository.private }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # Swift is a ~15 minute traced xcodebuild on macOS and the iOS code changes rarely, so it
        # runs on main and weekly, not on every PR.
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"language":"java-kotlin","runner":"ubuntu-latest"}]' || '[{"language":"java-kotlin","runner":"ubuntu-latest"},{"language":"swift","runner":"macos-latest"}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Match ios.yml: resolve the package before CodeQL instruments xcodebuild.
      # Resolving the graph inside the traced build can stall before compilation starts.
      - name: Resolve Swift packages before tracing
        if: ${{ matrix.language == 'swift' }}
        run: swift package resolve
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: manual
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: ${{ matrix.language == 'java-kotlin' }}
        with:
          distribution: temurin
          java-version: "21"
      - name: Build Android modules
        if: ${{ matrix.language == 'java-kotlin' }}
        working-directory: android
        run: ./gradlew assemble
      - name: Build Swift targets
        if: ${{ matrix.language == 'swift' }}
        run: xcodebuild build -scheme Versola-Package -sdk iphonesimulator -destination "generic/platform=iOS Simulator" ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}

  # Same source scanners as the server. These also run on schedules so new findings in
  # unchanged code are visible. Trivy covers supported manifests; it does not resolve the
  # Android Gradle graph. Dependabot and dependency review complement this scan.
  trivy-repo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Vulnerabilities and secrets (gating)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-dirs: .git,.claude

  # Gates on ERROR findings, matching the server. Registry metrics are disabled.
  # CodeQL remains the deeper Kotlin/Swift analysis; Semgrep complements it.
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Semgrep
        run: python3 -m pip install --user semgrep==1.179.0
      - name: Scan (gating)
        run: ~/.local/bin/semgrep scan --config p/default --metrics=off --severity ERROR --error --sarif --output semgrep.sarif --exclude .claude
      - name: Upload findings
        if: always() && hashFiles('semgrep.sarif') != '' && !github.event.repository.private
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: semgrep.sarif
          category: semgrep
