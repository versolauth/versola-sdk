name: conformance

# The harness of #15 (see conformance/README.md): the scenario catalogue against a real staged
# auth + central + edge, driven from an emulator. The stack half below is a copy of what
# versolauth/versola's own ci-cd.yml does to run `sbt e2e/test`, so the two cannot drift; the
# driver half runs :conformance-android (scenarios 01 and 21). Nightly and on demand rather than
# per pull request: a full stage plus an emulator boot is twenty minutes the unit and
# instrumented jobs in android.yml do not need to wait on.

on:
  workflow_dispatch:
    inputs:
      versola_ref:
        description: "versolauth/versola ref to stage (branch, tag or SHA)"
        required: false
        default: "main"
  schedule:
    - cron: "17 3 * * *"
  # The providers job below needs no secret and no emulator, so it also runs on the pull
  # requests that can break it: the generic facade, the protocol core it sits on, the driver and
  # the provider containers. The scenarios job stays on demand (see its `if:`).
  pull_request:
    paths:
      # The facade, the modules it is built from, the driver, the containers, the toolchain.
      - "android/oauth/**"
      - "android/oauth-core/**"
      - "android/okhttp/**"
      - "android/storage/**"
      - "android/browser/**"
      - "android/dpop/**"
      - "android/conformance-oauth/**"
      - "android/conformance-browser/**"
      - "android/conformance-browser-app/**"
      - "android/build.gradle.kts"
      - "android/settings.gradle.kts"
      - "android/gradle/**"
      - "android/gradle.properties"
      - "conformance/providers/**"
      - ".github/workflows/conformance.yml"

permissions:
  contents: read

jobs:
  # The generic facade (issue #46, B4) against a provider that is not Versola: scenarios 24 to
  # 32 (`facade: [oauth]`) from android/conformance-oauth, Robolectric tests over a real
  # network against a provider in Docker (conformance/providers/<name>). One matrix row per
  # provider: Keycloak and Ory Hydra. No emulator: the browser leg is the provider's login
  # form driven over HTTP, and what that does not prove is listed in conformance/README.md
  # ("Providers").
  providers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: keycloak
            issuer: http://localhost:8080/realms/conformance
            # The realm is imported before the health check passes; discovery answering is enough.
            ready: curl -fs http://localhost:8080/realms/conformance/.well-known/openid-configuration
          - provider: hydra
            issuer: http://localhost:4444
            # The clients are imported by a one-shot container that retries until hydra's admin
            # API answers; the driver needs both clients, so wait for the second one.
            ready: curl -fs http://localhost:4445/admin/clients | grep -q conformance-app-norefresh
    defaults:
      run:
        working-directory: android
    steps:
      # Pinned to commit SHAs (ci-release.md); the version is the comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" "build-tools;36.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # No `--wait`: the runner's compose exits 1 when a one-shot service exits 0, which is what
      # Hydra's client import does. The provider's own readiness condition from the matrix is
      # polled instead (Keycloak: discovery after the realm import; Hydra: both clients present).
      # The condition is a fixed string from this file, not from an input.
      - name: Start ${{ matrix.provider }}
        working-directory: conformance/providers/${{ matrix.provider }}
        env:
          READY: ${{ matrix.ready }}
        run: |
          docker compose up -d
          for _ in $(seq 1 90); do sh -c "$READY" && exit 0; sleep 2; done
          echo "provider not ready after 180 s" >&2; docker compose logs --no-color | tail -50; exit 1

      - name: Scenarios 24 to 32 against ${{ matrix.provider }}
        env:
          OAUTH_CONFORMANCE_PROVIDER: ${{ matrix.provider }}
          OAUTH_CONFORMANCE_ISSUER: ${{ matrix.issuer }}
        run: ./gradlew :conformance-oauth:testDebugUnitTest

      - name: Provider logs
        if: always()
        working-directory: conformance/providers/${{ matrix.provider }}
        run: docker compose logs --no-color > provider.log 2>&1 || true

      - name: Upload test reports and provider logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: providers-${{ matrix.provider }}
          path: |
            android/conformance-oauth/build/reports/tests
            android/conformance-oauth/build/test-results
            conformance/providers/${{ matrix.provider }}/provider.log
          if-no-files-found: ignore

  # The system browser leg, which `providers` above replaces with an HTTP conversation: the
  # host app in android/conformance-browser-app signs in against Keycloak through Chrome on an
  # emulator, driven by UI Automator (android/conformance-browser). Keycloak only: one provider
  # is enough to prove the platform half (the tab, the redirect, cancel, background, process
  # death), and a second adds a login form to maintain and nothing to the leg. The emulator is
  # the one android.yml's `instrumented` job boots (API 36, google_apis, x86_64: Chrome is on the
  # image); the provider is reached at its own address through `adb reverse`, so the issuer
  # matches what its discovery announces. The Auth Tab rows skip, by assumption, on an image
  # whose Chrome lacks Auth Tab; the log says so. conformance/README.md ("The browser leg").
  browser-leg:
    runs-on: ubuntu-latest
    # Two attempts at the emulator step (below), each up to fifteen minutes with the build.
    timeout-minutes: 50
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The emulator needs hardware acceleration; GitHub's Linux runners expose /dev/kvm but not
      # to the runner user by default.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" "build-tools;36.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Start keycloak
        working-directory: conformance/providers/keycloak
        run: |
          docker compose up -d
          for _ in $(seq 1 90); do curl -fs http://localhost:8080/realms/conformance/.well-known/openid-configuration && exit 0; sleep 2; done
          echo "keycloak not ready after 180 s" >&2; docker compose logs --no-color | tail -50; exit 1

      # What a lost emulator leaves behind. Many runs end in `adb: device 'emulator-5554'
      # not found` a minute or two into the instrumented run, with nothing in the step log that
      # says why (the emulator process simply goes away), so the runner is sampled from here
      # to the end of the job: memory and the biggest processes every few seconds, Keycloak's
      # container, and the emulator's logcat (re-attached after a restart, so the second attempt
      # below is in the same file). The `device offline` lines the emulator action prints while
      # the AVD boots are its own poll and appear in green runs too; they are not the failure.
      - name: Sample the runner while the emulator runs
        run: |
          mkdir -p "$RUNNER_TEMP/diag"
          cat > "$RUNNER_TEMP/sample.sh" <<'EOF'
          while :; do
            { date -u +%T; free -m | sed -n 2p; cat /proc/loadavg
              ps -eo pid,rss,pcpu,args --sort=-rss | head -6 | cut -c1-150
              docker stats --no-stream --format "{{.Name}} cpu={{.CPUPerc}} mem={{.MemUsage}}"; echo; } >> "$RUNNER_TEMP/diag/samples.log" 2>&1
            sleep 5
          done
          EOF
          # adb is not on PATH yet (the emulator action adds it), hence the full path.
          cat > "$RUNNER_TEMP/logcat.sh" <<'EOF'
          while :; do
            echo "--- logcat attached $(date -u +%T)" >> "$RUNNER_TEMP/diag/logcat.txt"
            "$ANDROID_HOME/platform-tools/adb" -s emulator-5554 logcat -v threadtime >> "$RUNNER_TEMP/diag/logcat.txt" 2>&1
            sleep 2
          done
          EOF
          nohup bash "$RUNNER_TEMP/sample.sh" > /dev/null 2>&1 &
          nohup bash "$RUNNER_TEMP/logcat.sh" > /dev/null 2>&1 &

      # Two attempts, the first allowed to fail. The emulator on a hosted runner is lost
      # often enough that the red runs were the emulator and not the SDK; a fresh
      # emulator is the only recovery, so the same step runs again, once, and the job is red only
      # if both attempts are. The retry cannot hide a real regression: a deterministic failure
      # fails both attempts and the job stays red (at twice the time). `outcome` is the result
      # before `continue-on-error` turns it into a pass.
      - name: The browser leg on an emulator
        id: leg1
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: true
          disable-spellchecker: true
          working-directory: android
          script: |
            adb reverse tcp:8080 tcp:8080
            ./gradlew :conformance-browser:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.issuer=http://localhost:8080/realms/conformance

      # Between the attempts: say what state the first one left (is the emulator process gone,
      # or alive and offline?), keep its results (the second overwrites the build directory),
      # and clear the emulator and the adb server so the second one gets port 5554 and a new AVD.
      - name: What the first attempt left behind
        if: steps.leg1.outcome == 'failure'
        run: |
          mkdir -p "$RUNNER_TEMP/diag/attempt1"
          echo "### adb devices"; adb devices -l || true
          echo "### emulator processes"; pgrep -af 'qemu-system|emulator' | cut -c1-200 || true
          echo "### free -m"; free -m
          echo "### kernel log: kills, OOM, crashes"; sudo dmesg 2>&1 | grep -iE 'out of memory|oom|killed process|segfault|qemu|emulator' | tail -30 || true
          cp -r conformance-browser/build/outputs/androidTest-results "$RUNNER_TEMP/diag/attempt1/" 2>/dev/null || true
          cp -r conformance-browser/build/reports/androidTests "$RUNNER_TEMP/diag/attempt1/" 2>/dev/null || true
          adb kill-server || true
          pkill -f qemu-system || true
          sleep 3

      - name: The browser leg on an emulator, second attempt
        if: steps.leg1.outcome == 'failure'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: true
          disable-spellchecker: true
          working-directory: android
          script: |
            adb reverse tcp:8080 tcp:8080
            ./gradlew :conformance-browser:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.issuer=http://localhost:8080/realms/conformance

      - name: Runner diagnostics
        if: always()
        run: |
          echo "### first attempt: ${{ steps.leg1.outcome }}"
          echo "### free -m"; free -m
          echo "### kernel log: kills, OOM, crashes"; sudo dmesg 2>&1 | grep -iE 'out of memory|oom|killed process|segfault|qemu|emulator' | tail -30 || true
          echo "### dmesg tail"; sudo dmesg 2>&1 | tee "$RUNNER_TEMP/diag/dmesg.txt" | tail -50
          echo "### biggest processes"; ps aux --sort=-rss | head -10 | cut -c1-200
          echo "### docker stats"; docker stats --no-stream || true
          echo "### samples, last 60 lines"; tail -60 "$RUNNER_TEMP/diag/samples.log" || true
          cp -r /tmp/android-runner "$RUNNER_TEMP/diag/android-runner" 2>/dev/null || true
          gzip -f "$RUNNER_TEMP/diag/logcat.txt" 2>/dev/null || true

      - name: Provider logs
        if: always()
        working-directory: conformance/providers/keycloak
        run: docker compose logs --no-color > provider.log 2>&1 || true

      - name: Upload test reports, provider logs and runner diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-leg
          # A re-run of the job uploads under the same name.
          overwrite: true
          path: |
            android/conformance-browser/build/reports/androidTests
            android/conformance-browser/build/outputs/androidTest-results
            conformance/providers/keycloak/provider.log
            ${{ runner.temp }}/diag
          if-no-files-found: ignore

  scenarios:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # On demand only until a VERSOLA_CHECKOUT_TOKEN secret exists for the private server
    # checkout; the nightly trigger then takes over by dropping this line.
    if: github.event_name == 'workflow_dispatch'
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: auth
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: 1234
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U dev -d auth"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: sdk

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: versolauth/versola
          ref: ${{ inputs.versola_ref || 'main' }}
          path: versola
          # A private repository: a token with read access to it, stored as a repo secret.
          token: ${{ secrets.VERSOLA_CHECKOUT_TOKEN }}
          # Not written to versola/.git/config: the steps below (sbt, npm, the staged services, the
          # emulator run) are third-party code that can read the checkout directory, and nothing
          # after this step needs to talk to GitHub as the token's owner.

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # ---- the stack, exactly as versola/.github/workflows/ci-cd.yml stages it ----

      - name: Set up JDK 25 for the server
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Scala CLI
        uses: VirtusLab/scala-cli-setup@3f5bf11a33bb88343238780c18257c8fa43789e1 # v1.18.0

      - name: Generate dev configs
        working-directory: versola
        run: echo "local" | scala-cli run scripts/gen-env.scala

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Build login forms
        working-directory: versola/central-ui
        run: npm ci && npm run build:forms

      - name: Stage services
        working-directory: versola
        run: sbt "central-postgres-impl/stage" "auth-postgres-impl/stage" "edge-postgres-impl/stage"

      - name: Start central, auth, the internal TLS terminator and edge
        working-directory: versola
        run: |
          PORT=9001 DPORT=9002 RUN_MIGRATIONS=true HTTP_CLIENT_POOL_SIZE=10 \
            nohup central/implementations/postgres/target/universal/stage/bin/central-postgres-impl \
            -Denv.path=central/dev/env.conf > central.log 2>&1 &
          for _ in $(seq 1 60); do curl -fs http://localhost:9002/readiness && break; sleep 2; done
          PORT=9003 DPORT=9004 APORT=9007 MPORT=9008 RUN_MIGRATIONS=true HTTP_CLIENT_POOL_SIZE=10 \
            nohup auth/implementations/postgres/target/universal/stage/bin/auth-postgres-impl \
            -Denv.path=auth/dev/env.conf > auth.log 2>&1 &
          for _ in $(seq 1 60); do curl -fs http://localhost:9004/readiness && break; sleep 2; done
          sudo nginx -c "$(pwd)/edge/dev/internal-tls/nginx.conf"
          PORT=9005 DPORT=9006 HTTP_CLIENT_POOL_SIZE=10 \
            nohup edge/implementations/postgres/target/universal/stage/bin/edge-postgres-impl \
            -Denv.path=edge/dev/env.conf > edge.log 2>&1 &
          for _ in $(seq 1 60); do curl -fs http://localhost:9006/readiness && break; sleep 2; done

      # ---- the driver ----

      - name: Set up JDK 21 for the SDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" "build-tools;36.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Run the scenario catalogue
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: sdk/android
          # The issuer auth announces is http://localhost:9003, and the SDK holds the
          # document to it, so the emulator's localhost is made the host's rather than the
          # URLs being rewritten (conformance/README.md, "Running the Android driver").
          script: |
            adb reverse tcp:9001 tcp:9001 && adb reverse tcp:9003 tcp:9003 && adb reverse tcp:9005 tcp:9005
            adb forward tcp:18080 tcp:18080
            ./gradlew :conformance-android:connectedDebugAndroidTest

      - name: Upload transcripts and server logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-run
          path: |
            sdk/android/conformance-android/build/reports/androidTests
            sdk/android/conformance-android/build/outputs/androidTest-results
            versola/central.log
            versola/auth.log
            versola/edge.log
          if-no-files-found: ignore
