name: conformance

# The harness of #15 (see conformance/README.md): the scenario catalogue against a real staged
# auth + central + edge, driven from an emulator. The stack half below is a copy of what
# versolauth/versola's own ci-cd.yml does to run `sbt e2e/test`, so the two cannot drift; the
# driver half runs :conformance-android (scenarios 01 and 21). Nightly and on demand rather than
# per pull request: a full stage plus an emulator boot is twenty minutes the unit and
# instrumented jobs in android.yml do not need to wait on.

on:
  workflow_dispatch:
    inputs:
      versola_ref:
        description: "versolauth/versola ref to stage (branch, tag or SHA)"
        required: false
        default: "main"
  schedule:
    - cron: "17 3 * * *"
  # The providers job below needs no secret and no emulator, so it also runs on the pull
  # requests that can break it: the generic facade, the protocol core it sits on, the driver and
  # the provider containers. The scenarios job stays on demand (see its `if:`).
  pull_request:
    paths:
      # The facade, the modules it is built from, the driver, the containers, the toolchain.
      - "android/oauth/**"
      - "android/oauth-core/**"
      - "android/okhttp/**"
      - "android/storage/**"
      - "android/browser/**"
      - "android/dpop/**"
      - "android/conformance-oauth/**"
      - "android/build.gradle.kts"
      - "android/settings.gradle.kts"
      - "android/gradle/**"
      - "android/gradle.properties"
      - "conformance/providers/**"
      - ".github/workflows/conformance.yml"

permissions:
  contents: read

jobs:
  # The generic facade (issue #46, B4) against a provider that is not Versola: scenarios 24 to
  # 32 (`facade: [oauth]`) from android/conformance-oauth, Robolectric tests over a real
  # network against a provider in Docker (conformance/providers/<name>). One matrix row per
  # provider: Keycloak and Ory Hydra. No emulator: the browser leg is the provider's login
  # form driven over HTTP, and what that does not prove is listed in conformance/README.md
  # ("Providers").
  providers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: keycloak
            issuer: http://localhost:8080/realms/conformance
            # The realm is imported before the health check passes; discovery answering is enough.
            ready: curl -fs http://localhost:8080/realms/conformance/.well-known/openid-configuration
          - provider: hydra
            issuer: http://localhost:4444
            # The clients are imported by a one-shot container that retries until hydra's admin
            # API answers; the driver needs both clients, so wait for the second one.
            ready: curl -fs http://localhost:4445/admin/clients | grep -q conformance-app-norefresh
    defaults:
      run:
        working-directory: android
    steps:
      # Pinned to commit SHAs (ci-release.md); the version is the comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      # No `--wait`: the runner's compose exits 1 when a one-shot service exits 0, which is what
      # Hydra's client import does. The provider's own readiness condition from the matrix is
      # polled instead (Keycloak: discovery after the realm import; Hydra: both clients present).
      # The condition is a fixed string from this file, not from an input.
      - name: Start ${{ matrix.provider }}
        working-directory: conformance/providers/${{ matrix.provider }}
        env:
          READY: ${{ matrix.ready }}
        run: |
          docker compose up -d
          for i in $(seq 1 90); do sh -c "$READY" && exit 0; sleep 2; done
          echo "provider not ready after 180 s" >&2; docker compose logs --no-color | tail -50; exit 1

      - name: Scenarios 24 to 32 against ${{ matrix.provider }}
        env:
          OAUTH_CONFORMANCE_PROVIDER: ${{ matrix.provider }}
          OAUTH_CONFORMANCE_ISSUER: ${{ matrix.issuer }}
        run: ./gradlew :conformance-oauth:testDebugUnitTest

      - name: Provider logs
        if: always()
        working-directory: conformance/providers/${{ matrix.provider }}
        run: docker compose logs --no-color > provider.log 2>&1 || true

      - name: Upload test reports and provider logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: providers-${{ matrix.provider }}
          path: |
            android/conformance-oauth/build/reports/tests
            android/conformance-oauth/build/test-results
            conformance/providers/${{ matrix.provider }}/provider.log
          if-no-files-found: ignore

  scenarios:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # On demand only until a VERSOLA_CHECKOUT_TOKEN secret exists for the private server
    # checkout; the nightly trigger then takes over by dropping this line.
    if: github.event_name == 'workflow_dispatch'
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: auth
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: 1234
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U dev -d auth"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
        with:
          path: sdk

      - uses: actions/checkout@v4
        with:
          repository: versolauth/versola
          ref: ${{ inputs.versola_ref || 'main' }}
          path: versola
          # A private repository: a token with read access to it, stored as a repo secret.
          token: ${{ secrets.VERSOLA_CHECKOUT_TOKEN }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # ---- the stack, exactly as versola/.github/workflows/ci-cd.yml stages it ----

      - name: Set up JDK 25 for the server
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Scala CLI
        uses: VirtusLab/scala-cli-setup@v1

      - name: Generate dev configs
        working-directory: versola
        run: echo "local" | scala-cli run scripts/gen-env.scala

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build login forms
        working-directory: versola/central-ui
        run: npm ci && npm run build:forms

      - name: Stage services
        working-directory: versola
        run: sbt "central-postgres-impl/stage" "auth-postgres-impl/stage" "edge-postgres-impl/stage"

      - name: Start central, auth, the internal TLS terminator and edge
        working-directory: versola
        run: |
          PORT=9001 DPORT=9002 RUN_MIGRATIONS=true HTTP_CLIENT_POOL_SIZE=10 \
            nohup central/implementations/postgres/target/universal/stage/bin/central-postgres-impl \
            -Denv.path=central/dev/env.conf > central.log 2>&1 &
          for i in $(seq 1 60); do curl -fs http://localhost:9002/readiness && break; sleep 2; done
          PORT=9003 DPORT=9004 APORT=9007 MPORT=9008 RUN_MIGRATIONS=true HTTP_CLIENT_POOL_SIZE=10 \
            nohup auth/implementations/postgres/target/universal/stage/bin/auth-postgres-impl \
            -Denv.path=auth/dev/env.conf > auth.log 2>&1 &
          for i in $(seq 1 60); do curl -fs http://localhost:9004/readiness && break; sleep 2; done
          sudo nginx -c "$(pwd)/edge/dev/internal-tls/nginx.conf"
          PORT=9005 DPORT=9006 HTTP_CLIENT_POOL_SIZE=10 \
            nohup edge/implementations/postgres/target/universal/stage/bin/edge-postgres-impl \
            -Denv.path=edge/dev/env.conf > edge.log 2>&1 &
          for i in $(seq 1 60); do curl -fs http://localhost:9006/readiness && break; sleep 2; done

      # ---- the driver ----

      - name: Set up JDK 21 for the SDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v5

      - name: Run the scenario catalogue
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: sdk/android
          # The issuer auth announces is http://localhost:9003, and the SDK holds the
          # document to it, so the emulator's localhost is made the host's rather than the
          # URLs being rewritten (conformance/README.md, "Running the Android driver").
          script: |
            adb reverse tcp:9001 tcp:9001 && adb reverse tcp:9003 tcp:9003 && adb reverse tcp:9005 tcp:9005
            adb forward tcp:18080 tcp:18080
            ./gradlew :conformance-android:connectedDebugAndroidTest

      - name: Upload transcripts and server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-run
          path: |
            sdk/android/conformance-android/build/reports/androidTests
            sdk/android/conformance-android/build/outputs/androidTest-results
            versola/central.log
            versola/auth.log
            versola/edge.log
          if-no-files-found: ignore
