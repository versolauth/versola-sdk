name: spec

on:
  push:
    branches: [main]
  pull_request:

# Least privilege (ci-release.md): nothing here writes to the repository.
permissions:
  contents: read

jobs:
  scenarios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -r tools/requirements.txt
      - run: python3 tools/validate-scenarios.py

  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: "**/*.md"

  # Every workflow file parses and its expressions, `needs:`, `if:` and shell steps hold up.
  # A file GitHub rejects does not fail loudly: it shows up as a "workflow file issue" run with no
  # jobs, and the scanners in it silently stop (security.yml carried a duplicate `schedule:` key
  # for 38 commits that way). actionlint reports a duplicate key, a bad `needs:` and a typo'd
  # expression context as errors, and runs shellcheck over every `run:` when it is on the PATH
  # (it is on the runner image). The release is the binary's checksum below, not a floating tag.
  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 # actionlint_1.7.12_linux_amd64.tar.gz
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
      # The `if: false` of the dormant jobs (CocoaPods, npm, pub.dev) is deliberate, and the one
      # message actionlint has for it is ignored by its text; everything else gates.
      - name: Lint the workflows
        run: '"$RUNNER_TEMP/actionlint" -color -ignore ''constant expression "false" in condition'''
