# Dependency updates for every ecosystem the SDKs use, so alerts and update PRs come from one
# place. The server repo's rule applies here too.
#
# Minor and patch updates are grouped into one PR per ecosystem per week. Majors are not
# grouped: each one is its own PR, so a major that breaks the build (an AGP or Kotlin bump, a
# Swift package API change) blocks only itself instead of the whole group.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      gradle:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      swift:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  # The versola_oauth plugin (flutter/versola_oauth/pubspec.yaml); pins are exact, so every
  # update is a PR.
  - package-ecosystem: pub
    directory: /flutter/versola_oauth
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    # The Pigeon version is part of the contract: both native halves are generated from
    # pigeons/messages.dart with it, so a bump that does not regenerate leaves the generated
    # files claiming the old version under a new pin. Bump it by hand, with the regeneration.
    ignore:
      - dependency-name: pigeon
    groups:
      pub:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
