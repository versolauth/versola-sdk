# Dependency updates for every ecosystem the SDKs use, so alerts and update PRs come from one
# place. The server repo's rule applies here too.
#
# Minor and patch updates are grouped into one PR per ecosystem per week. Majors are not
# grouped: each one is its own PR, so a major that breaks the build (an AGP or Kotlin bump, a
# Swift package API change) blocks only itself instead of the whole group.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      gradle:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  # The Flutter example's own Gradle build (flutter/versola_oauth/example/android): its test
  # dependencies are a copy of android/conformance-oauth's, and its plugin versions must equal
  # android/build.gradle.kts, because the example includes the repository's Android build and an
  # included build cannot load a second version of either plugin. The two plugins are therefore
  # ignored here: the bump of android/build.gradle.kts is the one that moves them, and
  # flutter.yml fails on that PR until the example's settings.gradle.kts follows.
  - package-ecosystem: gradle
    directory: /flutter/versola_oauth/example/android
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: com.android.application
      - dependency-name: org.jetbrains.kotlin.android
    groups:
      gradle:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  # The plugin's Android glue (flutter/versola_oauth/android). It is built through the example's
  # composite build, which has no verification of its own, so this entry is the only thing that
  # notices a stale coroutines or JUnit pin here. `io.versola:oauth-android` is the plugin's own
  # release pin: tools/prepare-release.sh moves it with the version, and check-release-version.sh
  # fails when it disagrees with pubspec.yaml, so a Dependabot bump of it would only break that.
  - package-ecosystem: gradle
    directory: /flutter/versola_oauth/android
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: io.versola:oauth-android
    groups:
      gradle:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      swift:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  # The versola_oauth plugin (flutter/versola_oauth/pubspec.yaml); pins are exact, so every
  # update is a PR.
  - package-ecosystem: pub
    directory: /flutter/versola_oauth
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    # The Pigeon version is part of the contract: both native halves are generated from
    # pigeons/messages.dart with it, so a bump that does not regenerate leaves the generated
    # files claiming the old version under a new pin. Bump it by hand, with the regeneration.
    ignore:
      - dependency-name: pigeon
    groups:
      pub:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  # The example app's own pub dependencies (cupertino_icons, the lints); the plugin is a path
  # dependency there.
  - package-ecosystem: pub
    directory: /flutter/versola_oauth/example
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      pub:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  # The provider containers of the conformance runs (conformance/providers/) and the Versola stack's
  # Postgres (conformance/stack/; its own images are `:latest` and are not touched). A provider
  # image is pinned to a release so that spec/providers.md can name what was tested: a bump here is
  # a PR whose `providers` run is the evidence, and the matrix row changes with it.
  - package-ecosystem: docker-compose
    directories:
      - /conformance/providers/keycloak
      - /conformance/providers/hydra
      - /conformance/stack
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      containers:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: pip
    directory: /tools
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      python:
        patterns: ["*"]
        update-types: ["minor", "patch"]
